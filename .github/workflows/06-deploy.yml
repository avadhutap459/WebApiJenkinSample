name: 06 - Production Deployment

on:
  workflow_run:
    workflows:
      - "05 - Production Approval"
    types:
      - completed

defaults:
  run:
    shell: powershell

jobs:

  ####################################################
  # Wait for Deployment Window
  ####################################################
  wait-for-deployment-time:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: self-hosted

    timeout-minutes: 180

    steps:

      - name: Wait Until 10 PM
        shell: powershell
        run: |

          $Target = Get-Date -Hour 22 -Minute 0 -Second 0

          if((Get-Date) -gt $Target)
          {
              $Target = $Target.AddDays(1)
          }

          Write-Host ""
          Write-Host "======================================="
          Write-Host "Deployment Window"
          Write-Host "Current Time : $(Get-Date)"
          Write-Host "Target Time  : $Target"
          Write-Host "======================================="

          while((Get-Date) -lt $Target)
          {
              Write-Host "Waiting for deployment window..."
              Start-Sleep -Seconds 60
          }

          Write-Host ""
          Write-Host "Deployment window started."

  ####################################################
  # Production Deployment
  ####################################################
  deploy:

    needs: wait-for-deployment-time

    runs-on: self-hosted

    timeout-minutes: 60

    environment:
      name: production

    steps:

      ####################################################
      # Checkout
      ####################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Execute Deployment
      ####################################################
      - name: Execute Ansible Deployment
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================="
          Write-Host "Starting Production Deployment"
          Write-Host "======================================="

          powershell.exe `
            -ExecutionPolicy Bypass `
            -File D:\GitHubRunner\Scripts\Deploy.ps1

          if($LASTEXITCODE -ne 0)
          {
              throw "Deployment Failed."
          }

          Write-Host ""
          Write-Host "Deployment Completed Successfully"

      ####################################################
      # Health Check
      ####################################################
      - name: Execute Health Check
        shell: powershell
        run: |

          ssh `
            -i C:\Users\Administrator\.ssh\id_rsa `
            -o BatchMode=yes `
            -o StrictHostKeyChecking=no `
            root@172.31.37.164 `
            "cd /opt/ansible && sudo ansible-playbook playbooks/healthcheck.yml"

          if($LASTEXITCODE -ne 0)
          {
              throw "Health Check Failed."
          }

      ####################################################
      # Deployment Summary
      ####################################################
      - name: Deployment Summary
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "==============================================="
          Write-Host "Production Deployment Completed Successfully"
          Write-Host "==============================================="
          Write-Host "Repository : ${{ github.repository }}"
          Write-Host "Branch     : ${{ github.event.workflow_run.head_branch }}"
          Write-Host "Run Number : ${{ github.event.workflow_run.run_number }}"
          Write-Host "Server     : 172.31.37.164"
          Write-Host "Date       : $(Get-Date)"
          Write-Host "==============================================="
