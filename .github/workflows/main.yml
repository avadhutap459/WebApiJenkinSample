name: Production CI/CD

on:
  push:
    branches:
      - master

jobs:

  build-deploy:

    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    env:
      PUBLISH_FOLDER: D:\GitHubRunner\Publish
      PACKAGE_FOLDER: D:\GitHubRunner\Packages
      PACKAGE_NAME: WebApi.zip

      REPORT_FOLDER: D:\GitHubRunner\Reports
      SONAR_REPORT: D:\GitHubRunner\Reports\Sonar
      COVERAGE_REPORT: D:\GitHubRunner\Reports\Coverage
      TEST_REPORT: D:\GitHubRunner\Reports\TestResults

    steps:

    ####################################################
    # Checkout
    ####################################################

    - name: Checkout Repository
      uses: actions/checkout@v4

    ####################################################
    # Verify SDK
    ####################################################

    - name: Verify .NET SDK
      run: |
        dotnet --info
        dotnet --list-sdks

    ####################################################
    # Restore
    ####################################################

    - name: Restore NuGet Packages
      run: |
        dotnet restore
    
    ####################################################
    # Sonar Begin
    ####################################################
    
    - name: Sonar Begin
    
      run: |
    
        dotnet sonarscanner begin `
          /k:"WebApi" `
          /d:sonar.host.url="http://3.110.161.22" `
          /d:sonar.token="sqp_0913fb0bf42e02716c50db872938b3bd54adba53" `
          /d:sonar.cs.vstest.reportsPaths="$env:TEST_REPORT\*.trx" `
          /d:sonar.cs.opencover.reportsPaths="$env:COVERAGE_REPORT\coverage.opencover.xml"
    
    ####################################################
    # Build
    ####################################################

    - name: Build Solution
      run: |
        dotnet build --configuration Release --no-restore

    ####################################################
    # Unit Test + Coverage
    ####################################################
    
    - name: Run Unit Tests
    
      run: |
    
        dotnet test `
          --configuration Release `
          --no-build `
          --logger "trx;LogFileName=TestResults.trx" `
          --results-directory "$env:TEST_REPORT" `
          /p:CollectCoverage=true `
          /p:CoverletOutput="$env:COVERAGE_REPORT\" `
          /p:CoverletOutputFormat=opencover

    ####################################################
    # Sonar End
    ####################################################
    
    - name: Sonar End
    
      run: |
    
        dotnet sonarscanner end `
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

    ####################################################
    # Quality Gate
    ####################################################
    
    - name: Wait for Sonar Quality Gate
    
      uses: sonarsource/sonarqube-quality-gate-action@master
    
      timeout-minutes: 10
    
      env:
    
        SONAR_HOST_URL: http://3.110.161.22
    
        SONAR_TOKEN: sqp_0913fb0bf42e02716c50db872938b3bd54adba53

    ####################################################
    # Export Sonar Report
    ####################################################
    
    - name: Export Sonar Report
    
      run: |
    
        if(!(Test-Path "$env:SONAR_REPORT"))
        {
          New-Item -ItemType Directory `
            "$env:SONAR_REPORT" | Out-Null
        }
    
        $pair = "${{ secrets.SONAR_TOKEN }}:"
        $encoded = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
    
        Invoke-RestMethod `
          -Uri "${{ secrets.SONAR_HOST_URL }}/api/issues/search?componentKeys=WebApi" `
          -Headers @{ Authorization = "Basic $encoded" } |
          ConvertTo-Json -Depth 10 |
          Out-File "$env:SONAR_REPORT\Issues.json"
    
        Invoke-RestMethod `
          -Uri "${{ secrets.SONAR_HOST_URL }}/api/measures/component?component=WebApi&metricKeys=coverage,bugs,vulnerabilities,code_smells,duplicated_lines_density" `
          -Headers @{ Authorization = "Basic $encoded" } |
          ConvertTo-Json -Depth 10 |
          Out-File "$env:SONAR_REPORT\Metrics.json"

    ####################################################
    # Generate Coverage Report
    ####################################################
    
    - name: Generate Coverage Report
    
      run: |
    
        reportgenerator `
          -reports:"$env:COVERAGE_REPORT\coverage.opencover.xml" `
          -targetdir:"$env:COVERAGE_REPORT\Html" `
          -reporttypes:Html
    
    ####################################################
    # Publish
    ####################################################

    - name: Publish Application
      run: |
        Remove-Item "$env:PUBLISH_FOLDER\*" -Recurse -Force -ErrorAction SilentlyContinue

        dotnet publish `
          --configuration Release `
          --output "$env:PUBLISH_FOLDER"

    ####################################################
    # Zip Package
    ####################################################

    - name: Create Deployment Package
      run: |

        if(Test-Path "$env:PACKAGE_FOLDER\$env:PACKAGE_NAME")
        {
            Remove-Item "$env:PACKAGE_FOLDER\$env:PACKAGE_NAME" -Force
        }

        Compress-Archive `
          -Path "$env:PUBLISH_FOLDER\*" `
          -DestinationPath "$env:PACKAGE_FOLDER\$env:PACKAGE_NAME"

    ####################################################
    # Verify Package
    ####################################################

    - name: Verify Package
      run: |

        Get-ChildItem "$env:PACKAGE_FOLDER"
        
    ####################################################
    # Verify SSH
    ####################################################
    
    - name: Test SSH
      shell: powershell
      run: |
        ssh `
          -v `
          -i C:\Users\Administrator\.ssh\id_rsa `
          -o BatchMode=yes `
          -o StrictHostKeyChecking=no `
          root@172.31.47.142 `
          "hostname"

    ####################################################
    # Copy Package to Ansible
    ####################################################

    - name: Copy Package to Ansible Server
      run: |

        powershell.exe `
        -ExecutionPolicy Bypass `
        -File D:\GitHubRunner\Scripts\CopyToAnsible.ps1

    ####################################################
    # Copy Sonar Reports
    ####################################################
    
    - name: Copy Sonar Reports
    
      run: |
    
        powershell.exe `
          -ExecutionPolicy Bypass `
          -File D:\GitHubRunner\Scripts\CopyReportsToAnsible.ps1
    
    ####################################################
    # Verify Copy
    ####################################################

    - name: Verify Package on Ansible
      run: |

        ssh root@172.31.47.142 `
        "ls -lh /opt/ansible/artifacts/latest"

    ####################################################
    # Deploy
    ####################################################

    - name: Execute Ansible Deployment
      run: |

        powershell.exe `
        -ExecutionPolicy Bypass `
        -File D:\GitHubRunner\Scripts\Deploy.ps1

    ####################################################
    # Health Check
    ####################################################

    - name: Health Check
      run: |

        ssh root@172.31.47.142 `
        "cd /opt/ansible && sudo ansible-playbook playbooks/healthcheck.yml"

    ####################################################
    # Finished
    ####################################################

    - name: Deployment Completed
      run: |

        Write-Host ""
        Write-Host "=================================="
        Write-Host "Deployment Completed Successfully"
        Write-Host "=================================="
