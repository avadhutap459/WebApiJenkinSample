name: Production CI/CD

on:
  push:
    branches:
      - master

jobs:

  build-deploy:

    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    env:
      PUBLISH_FOLDER: D:\GitHubRunner\Publish
      PACKAGE_FOLDER: D:\GitHubRunner\Packages
      PACKAGE_NAME: WebApi.zip

      REPORT_FOLDER: D:\GitHubRunner\Reports
      SONAR_REPORT: D:\GitHubRunner\Reports\Sonar
      COVERAGE_REPORT: D:\GitHubRunner\Reports\Coverage
      TEST_REPORT: D:\GitHubRunner\Reports\TestResults

    steps:

    ####################################################
    # Checkout
    ####################################################

    - name: Checkout Repository
      uses: actions/checkout@v4

    ####################################################
    # Verify SDK
    ####################################################

    - name: Verify .NET SDK
      run: |
        dotnet --info
        dotnet --list-sdks

    ####################################################
    # Restore
    ####################################################

    - name: Restore NuGet Packages
      run: |
        dotnet restore
    
    ####################################################
    # Sonar Begin
    ####################################################
    
    - name: Sonar Begin
    
      run: |
    
        dotnet sonarscanner begin `
          /k:"WebApi" `
          /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" `
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
          /d:sonar.cs.vstest.reportsPaths="$env:TEST_REPORT\*.trx" `
          /d:sonar.cs.opencover.reportsPaths="$env:COVERAGE_REPORT\coverage.opencover.xml"
    
    ####################################################
    # Build
    ####################################################

    - name: Build Solution
      run: |
        dotnet build --configuration Release --no-restore

    ####################################################
    # Unit Test + Coverage
    ####################################################
    
    - name: Run Unit Tests
    
      run: |
    
        dotnet test `
          --configuration Release `
          --no-build `
          --logger "trx;LogFileName=TestResults.trx" `
          --results-directory "$env:TEST_REPORT" `
          /p:CollectCoverage=true `
          /p:CoverletOutput="$env:COVERAGE_REPORT\" `
          /p:CoverletOutputFormat=opencover

    ####################################################
    # Sonar End
    ####################################################
    
    - name: Sonar End
    
      run: |
    
        dotnet sonarscanner end `
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

    ####################################################
    # Wait for Sonar Quality Gate
    ####################################################
    
    - name: Check Sonar Quality Gate
      shell: powershell
      run: |
    
        $Token = "${{ secrets.SONAR_TOKEN }}"
        $SonarHost = "${{ secrets.SONAR_HOST_URL }}"
    
        $pair = $Token + ":"
    
        $base64 = [Convert]::ToBase64String(
            [System.Text.Encoding]::ASCII.GetBytes($pair)
        )
    
        Write-Host "Waiting for Sonar analysis..."
        Start-Sleep -Seconds 20
    
        $result = Invoke-RestMethod `
            -Uri "$SonarHost/api/qualitygates/project_status?projectKey=WebApi" `
            -Headers @{
                Authorization = "Basic $base64"
            }
    
        Write-Host "Quality Gate Status: $($result.projectStatus.status)"
    
        if ($result.projectStatus.status -ne "OK")
        {
            throw "Quality Gate Failed"
        }
    
    ####################################################
    # Export Sonar Reports
    ####################################################
    
    - name: Export Sonar Reports
    
      run: |
    
        if(Test-Path "$env:SONAR_REPORT")
        {
            Remove-Item "$env:SONAR_REPORT\*" -Recurse -Force -ErrorAction SilentlyContinue
        }
        else
        {
            New-Item -ItemType Directory `
              "$env:SONAR_REPORT" | Out-Null
        }
    
        $Token="${{ secrets.SONAR_TOKEN }}"
    
        $pair=$Token + ":"
    
        $base64=[Convert]::ToBase64String(
            [System.Text.Encoding]::ASCII.GetBytes($pair)
        )
    
        ##################################################
        # Export Metrics
        ##################################################
    
        Invoke-RestMethod `
          -Uri "${{ secrets.SONAR_HOST_URL }}/api/measures/component?component=WebApi&metricKeys=coverage,bugs,vulnerabilities,code_smells,duplicated_lines_density,reliability_rating,security_rating,sqale_rating,ncloc"
    
          -Headers @{
              Authorization="Basic $base64"
          } |
          ConvertTo-Json -Depth 50 |
          Out-File "$env:SONAR_REPORT\Metrics.json"
    
        ##################################################
        # Export Issues
        ##################################################
    
        Invoke-RestMethod `
          -Uri "${{ secrets.SONAR_HOST_URL }}/api/issues/search?componentKeys=WebApi&ps=500"
    
          -Headers @{
              Authorization="Basic $base64"
          } |
          ConvertTo-Json -Depth 100 |
          Out-File "$env:SONAR_REPORT\Issues.json"

    ####################################################
    # Generate Sonar HTML Report
    ####################################################
    
    - name: Generate Sonar HTML Report
    
      run: |
    
          $metrics = Get-Content `
          "$env:SONAR_REPORT\Metrics.json" |
          ConvertFrom-Json
    
          $html=@"
    
                  <html>
                  
                  <head>
                  
                  <title>SonarQube Report</title>
                  
                  <style>
                  
                  body{
                  font-family:Arial;
                  margin:40px;
                  }
                  
                  table{
                  width:80%;
                  border-collapse:collapse;
                  }
                  
                  th,td{
                  border:1px solid black;
                  padding:10px;
                  }
                  
                  th{
                  background:#efefef;
                  }
                  
                  </style>
                  
                  </head>
                  
                  <body>
                  
                  <h1>SonarQube Analysis Report</h1>
                  
                  <table>
                  
                  <tr>
                  
                  <th>Metric</th>
                  
                  <th>Value</th>
                  
                  </tr>
                  
                  "@
                  
                  foreach($item in $metrics.component.measures)
                  {
                  
                  $html += "<tr><td>$($item.metric)</td><td>$($item.value)</td></tr>"
                  
                  }
                  
                  $html += @"
                  
                  </table>
                  
                  </body>
                  
                  </html>
                  
                  "@
                  
          $html |
          Out-File "$env:SONAR_REPORT\SonarReport.html"

    ####################################################
    # Generate PDF Report
    ####################################################
    
    - name: Generate PDF Report
    
      run: |
    
          & "C:\Program Files\wkhtmltopdf\bin\wkhtmltopdf.exe" `
          "$env:SONAR_REPORT\SonarReport.html" `
          "$env:SONAR_REPORT\SonarReport.pdf"

    ####################################################
    # Generate Coverage Report
    ####################################################
    
    - name: Generate Coverage Report

      run: |
    
          reportgenerator `
            -reports:"$env:COVERAGE_REPORT\coverage.opencover.xml" `
            -targetdir:"$env:COVERAGE_REPORT\Html" `
            -reporttypes:"Html;HtmlSummary"
    
    ####################################################
    # Verify Reports
    ####################################################
    
    - name: Verify Reports
    
      run: |
    
          Get-ChildItem `
          "$env:REPORT_FOLDER" `
          -Recurse

    ####################################################
    # Zip Reports
    ####################################################
    
    - name: Zip Reports
    
      run: |
    
          $ReportZip="$env:PACKAGE_FOLDER\Reports.zip"
    
          if(Test-Path $ReportZip)
          {
              Remove-Item $ReportZip -Force
          }
    
          Compress-Archive `
              -Path "$env:REPORT_FOLDER\*" `
              -DestinationPath $ReportZip
              
    ####################################################
    # Publish
    ####################################################

    - name: Publish Application
      run: |
        Remove-Item "$env:PUBLISH_FOLDER\*" -Recurse -Force -ErrorAction SilentlyContinue

        dotnet publish `
          --configuration Release `
          --output "$env:PUBLISH_FOLDER"

    ####################################################
    # Zip Package
    ####################################################

    - name: Create Deployment Package
      run: |

        if(Test-Path "$env:PACKAGE_FOLDER\$env:PACKAGE_NAME")
        {
            Remove-Item "$env:PACKAGE_FOLDER\$env:PACKAGE_NAME" -Force
        }

        Compress-Archive `
          -Path "$env:PUBLISH_FOLDER\*" `
          -DestinationPath "$env:PACKAGE_FOLDER\$env:PACKAGE_NAME"

    ####################################################
    # Verify Package
    ####################################################

    - name: Verify Package
      run: |

        Get-ChildItem "$env:PACKAGE_FOLDER"
        
    ####################################################
    # Verify SSH
    ####################################################
    
    - name: Test SSH
      shell: powershell
      run: |
        ssh `
          -v `
          -i C:\Users\Administrator\.ssh\id_rsa `
          -o BatchMode=yes `
          -o StrictHostKeyChecking=no `
          root@172.31.47.142 `
          "hostname"

    ####################################################
    # Copy Package to Ansible
    ####################################################

    - name: Copy Package to Ansible Server
      run: |

        powershell.exe `
        -ExecutionPolicy Bypass `
        -File D:\GitHubRunner\Scripts\CopyToAnsible.ps1

    ####################################################
    # Copy Sonar Reports
    ####################################################
    
    - name: Copy Sonar Reports
    
      run: |
    
        powershell.exe `
          -ExecutionPolicy Bypass `
          -File D:\GitHubRunner\Scripts\CopyReportsToAnsible.ps1
    
    ####################################################
    # Verify Copy
    ####################################################

    - name: Verify Package on Ansible
      run: |

        ssh root@172.31.47.142 `
        "ls -lh /opt/ansible/artifacts/latest"

    ####################################################
    # Deploy
    ####################################################

    - name: Execute Ansible Deployment
      run: |

        powershell.exe `
        -ExecutionPolicy Bypass `
        -File D:\GitHubRunner\Scripts\Deploy.ps1

    ####################################################
    # Health Check
    ####################################################

    - name: Health Check
      run: |

        ssh root@172.31.47.142 `
        "cd /opt/ansible && sudo ansible-playbook playbooks/healthcheck.yml"

    ####################################################
    # Finished
    ####################################################

    - name: Deployment Completed
      run: |

        Write-Host ""
        Write-Host "=================================="
        Write-Host "Deployment Completed Successfully"
        Write-Host "=================================="
