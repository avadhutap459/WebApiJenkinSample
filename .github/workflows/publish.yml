name: Production Deployment

on:
  push:
    branches:
      - master

jobs:
 deploy:

    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    env:
      PUBLISH_FOLDER: D:\GitHubRunner\Publish
      PACKAGE_FOLDER: D:\GitHubRunner\Packages

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Verify .NET SDK
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Restore
        run: |
          dotnet restore

      - name: Build
        run: |
          dotnet build --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test --configuration Release --no-build

      - name: Publish
        run: |
          dotnet publish -c Release -o "$env:PUBLISH_FOLDER"

      - name: Create ZIP
        run: |
          Compress-Archive `
            -Path "$env:PUBLISH_FOLDER\*" `
            -DestinationPath "$env:PACKAGE_FOLDER\WebApi.zip" `
            -Force
            
      - name: Copy Package to Ansible
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass `
          -File D:\GitHubRunner\Scripts\CopyToAnsible.ps1

      - name: Deploy using Ansible
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass `
          -File D:\GitHubRunner\Scripts\Deploy.ps1
